[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "follow-up-acquisition"
version = "0.3.1"
description = "Follow-up local acquisition runtime producing versioned Signal Batches"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
# The core (contracts/runtime/config/cache/redaction) stays stdlib-only; the
# RSS and Blog adapters pull in their parsers lazily and are declared as extras
# so the foundation remains install-free and offline-runnable.
rss = ["feedparser==6.0.14"]
blog = ["feedparser==6.0.14", "trafilatura==2.2.0"]

[project.scripts]
follow-up-acquisition = "follow_up_acquisition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/follow-up-acquisition/config" = ["config/sources.json"]
"share/follow-up-acquisition/contracts" = ["contracts/signal-batch.schema.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
